// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Two Kotlin stdlib versions end up on the same classpath here, and
    // kotlin-stdlib-jdk8 1.6.21 carries the same kotlin.streams and kotlin.text
    // classes that kotlin-stdlib 1.8.22 already defines. D8 then refuses to
    // dex with "Duplicate class kotlin.streams.jdk8.StreamsKt". Aligning every
    // stdlib artifact on one version removes the overlap. The BOM is the
    // mechanism JetBrains documents for this; it is declared with
    // constraints so it applies whether or not Kotlin is otherwise on the path.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin" &&
                details.requested.name.startsWith("kotlin-stdlib")) {
                details.useVersion("1.8.22")
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
