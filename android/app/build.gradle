apply plugin: 'com.android.application'

android {
    namespace = "com.malto.partner"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        // Values come from the environment, never from a file in the repo. An
        // installed app can only be updated by a build signed with the same
        // key, so a lost keystore means every cleaner has to uninstall and
        // loses their session. The keystore itself lives outside the repository
        // and is backed up separately.
        release {
            storeFile file(project.findProperty("MALTO_KEYSTORE") ?: System.getenv("MALTO_KEYSTORE") ?: "")
            storePassword System.getenv("MALTO_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("MALTO_KEY_ALIAS") ?: "malto"
            keyPassword System.getenv("MALTO_KEY_PASSWORD") ?: ""
            // v1 as well as v2. v2 alone is enough from API 24 up, but enabling
            // the JAR signature costs nothing and means the APK still installs
            // on a sideloaded device whose package installer is fussy or old.
            enableV1Signing true
            enableV2Signing true
        }
    }

    defaultConfig {
        applicationId "com.malto.partner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump versionCode on every release. Android refuses an update whose
        // versionCode is not higher than the installed one, so a forgotten bump
        // means the cleaner silently keeps the old build.
        // providers.gradleProperty is the supported way to read a -P flag.
        // project.hasProperty does not reliably resolve these on an
        // application module in Gradle 8 and failed the build outright.
        versionCode providers.gradleProperty("appVersionCode").map { it.toInteger() }.getOrElse(1)
        versionName providers.gradleProperty("appVersionName").getOrElse("1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Falls back to the debug key when the signing environment is not
            // set, so a plain `assembleRelease` still produces something
            // installable for a quick test rather than failing outright.
            signingConfig System.getenv("MALTO_KEYSTORE_PASSWORD")
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// @capacitor/browser pulls in androidx.browser 1.9.0, whose AAR metadata
// demands compileSdk 36. 1.8.0 is the last release that builds against 34, and
// nothing in the Custom Tabs flow this app uses needs the newer one. Forcing it
// here is what lets the whole project compile on the only aapt2 that runs on
// this machine; the release build in CI uses compileSdk 36 and needs no pin.
configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
